name: test
on:
  pull_request:
  workflow_call:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: macOS loopback aliases for the simulated WiZ bulbs (127.0.0.x)
        if: runner.os == 'macOS'
        run: for i in $(seq 2 100); do sudo ifconfig lo0 alias 127.0.0.$i up; done
      - run: npm ci
      - run: npm test
