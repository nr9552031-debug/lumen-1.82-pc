name: build
# Builds the Windows installer + portable exe and the Mac dmg/zip. Run it from the Actions tab (Run workflow),
# or push a tag like v1.8.3. Download the files from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            name: Lumen-Windows
          - os: macos-latest
            script: dist:mac
            name: Lumen-Mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Lumen-1.8.2-source-for-PC/Lumen-1.8.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Lumen-1.8.2-source-for-PC/Lumen-1.8.2/package-lock.json
      - run: npm ci
      - name: Make Mac icon
        if: runner.os == 'macOS'
        run: bash scripts/make-icns.sh
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            Lumen-1.8.2-source-for-PC/Lumen-1.8.2/dist/*.exe
            Lumen-1.8.2-source-for-PC/Lumen-1.8.2/dist/*.dmg
            Lumen-1.8.2-source-for-PC/Lumen-1.8.2/dist/*.zip
          if-no-files-found: error
