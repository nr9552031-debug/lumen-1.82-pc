name: build
# On every push to main: test on Windows/Mac/Linux, build the PC and Mac apps, and publish both to the "latest" release.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            name: Lumen-PC
          - os: macos-15
            script: dist:mac
            name: Lumen-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set build version (goes up by one every build)
        shell: bash
        run: node scripts/ci-version.js --apply
      - name: Make Mac icon
        if: runner.os == 'macOS'
        run: bash scripts/make-icns.sh
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        run: echo "v=$(node scripts/ci-version.js)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/* --target "${{ github.sha }}" --prerelease \
            --title "Lumen ${{ steps.ver.outputs.v }} (latest build, PC + Mac)" \
            --notes "Version ${{ steps.ver.outputs.v }}. Auto-built from commit ${{ github.sha }}. PC: Lumen-Setup / Lumen-Portable .exe. Mac: .dmg (Apple Silicon and Intel). Mac build is unsigned: right-click the app and choose Open the first time."
